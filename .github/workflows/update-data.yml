name: Update quarterly data

on:
  schedule:
    - cron: "0 13 2 1,4,7,10 *"   # 2nd day after each quarter closes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas lxml html5lib requests
      - run: python scripts/build_data.py
      - name: Commit data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update data through latest quarter"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
